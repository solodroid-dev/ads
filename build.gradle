// Top-level build file where you can add configuration options common to all sub-projects/modules.
plugins {
    id 'com.android.application' version '8.6.0' apply false
    id 'com.android.library' version '8.6.0' apply false
//    id 'com.android.application' version '8.9.2' apply false
//    id 'com.android.library' version '8.9.2' apply false
}

// Di Root build.gradle
subprojects {
    // Menggunakan callback yang lebih aman untuk Gradle
    project.plugins.withType(com.android.build.gradle.LibraryPlugin) {
        project.apply plugin: 'maven-publish'

        project.afterEvaluate {
            project.publishing {
                publications {
                    release(MavenPublication) {
                        // Mengambil komponen release dari library
                        from project.components.findByName('release')

                        groupId = 'com.github.solodroid-dev'
                        artifactId = project.name
                        version = '1.3.3-beta02'
                    }
                }
            }
        }
    }
}