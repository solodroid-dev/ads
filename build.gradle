// Top-level build file where you can add configuration options common to all sub-projects/modules.
plugins {
    id 'com.android.application' version '8.6.0' apply false
    id 'com.android.library' version '8.6.0' apply false
//    id 'com.android.application' version '8.9.2' apply false
//    id 'com.android.library' version '8.9.2' apply false
}

// Di Root build.gradle
subprojects {
    project.plugins.withType(com.android.build.gradle.LibraryPlugin) {
        project.apply plugin: 'maven-publish'

        project.afterEvaluate {
            project.publishing {
                publications {
                    release(MavenPublication) {
                        from project.components.findByName('release')
                        groupId = 'com.github.solodroid-dev'
                        artifactId = project.name
                        version = '1.3.3-alpha04'
                    }
                }
            }
        }
    }
}

subprojects { project ->
    project.plugins.withType(com.android.build.gradle.LibraryPlugin) {
        project.apply plugin: 'maven-publish'

        // Menggunakan afterEvaluate agar semua modul selesai di-load
        project.afterEvaluate {
            if (project.plugins.hasPlugin('maven-publish')) {
                project.publishing {
                    publications {
                        // Ganti 'release' dengan nama unik agar tidak bentrok
                        maven(MavenPublication) {
                            // Gunakan lazy-check untuk komponen release
                            def component = project.components.findByName('release')
                            if (component != null) {
                                from component
                            } else {
                                // Jika tetap tidak ketemu, ambil dari bundle AAR langsung
                                artifact project.layout.buildDirectory.file("outputs/aar/${project.name}-release.aar")
                            }

                            groupId = 'com.github.solodroid-dev'
                            artifactId = project.name
                            version = '1.3.3-alpha05'
                        }
                    }
                }
            }
        }
    }
}