// Top-level build file where you can add configuration options common to all sub-projects/modules.
plugins {
    id 'com.android.application' version '8.6.0' apply false
    id 'com.android.library' version '8.6.0' apply false
//    id 'com.android.application' version '8.9.2' apply false
//    id 'com.android.library' version '8.9.2' apply false
}

// Di Root build.gradle
subprojects {
    project.plugins.withType(com.android.build.gradle.LibraryPlugin) {
        project.apply plugin: 'maven-publish'

        project.afterEvaluate {
            project.publishing {
                publications {
                    release(MavenPublication) {
                        from project.components.findByName('release')
                        groupId = 'com.github.solodroid-dev'
                        artifactId = project.name
                        version = '1.3.3-alpha04'
                    }
                }
            }
        }
    }
}

// Di Root build.gradle
subprojects { project ->
    project.plugins.withType(com.android.build.gradle.LibraryPlugin) {
        project.apply plugin: 'maven-publish'

        project.afterEvaluate {
            if (project.plugins.hasPlugin('maven-publish')) {
                project.publishing {
                    publications {
                        maven(MavenPublication) {
                            // Coba ambil dari komponen dulu (cara paling aman)
                            def component = project.components.findByName('release')
                            if (component != null) {
                                from component
                            } else {
                                // Jika komponen belum siap, ambil file AAR secara manual
                                // Tapi kali ini kita beri tahu Gradle siapa yang membuat file ini
                                def aarFile = project.layout.buildDirectory.file("outputs/aar/${project.name}-release.aar")
                                artifact(aarFile) {
                                    // SOLUSI ERROR ANDA: Beritahu Gradle task mana yang menghasilkan AAR ini
                                    builtBy(project.tasks.named('bundleReleaseAar'))
                                }
                            }

                            groupId = 'com.github.solodroid-dev'
                            artifactId = project.name
                            version = '1.3.3-alpha7'
                        }
                    }
                }
            }
        }
    }
}